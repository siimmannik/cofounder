<style>
  :root{
    --bg:#0c1016;--panel:#141b25;--panel2:#1b2430;--line:#27323f;--txt:#dde5ee;
    --dim:#8593a4;--accent:#39d98a;--accent2:#5cc8ff;--warn:#ffb454;--bad:#ff6b6b;
    --gold:#ffd166;--mag:#D4537E;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#090d12;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600}
  header h1 b{color:var(--accent)}
  .sp{flex:1}
  button{font-family:var(--sans);font-size:13px;padding:7px 12px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel2);color:var(--txt);transition:.1s}
  button:hover{border-color:var(--accent2)}
  button.pri{border-color:var(--accent);color:var(--accent)}
  button.danger{border-color:var(--bad);color:var(--bad)}
  .tabs{display:flex;gap:4px;padding:8px 16px;background:#0a0e14;border-bottom:1px solid var(--line);
    position:sticky;top:49px;z-index:19;flex-wrap:wrap}
  .tab{padding:7px 13px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--dim);border:1px solid transparent}
  .tab.on{background:var(--panel2);color:var(--accent);border-color:var(--line)}
  main{max-width:1100px;margin:0 auto;padding:18px}
  .view{display:none}.view.on{display:block}
  .hint{color:var(--dim);font-size:12px;margin:0 0 14px;line-height:1.5}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .f{display:flex;flex-direction:column;gap:3px}
  .f label{font-size:11px;color:var(--dim)}
  input,select,textarea{font-family:var(--sans);font-size:13px;background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:7px 9px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent2)}
  input.num{width:90px;font-family:var(--mono)}
  input.wide{min-width:240px}
  textarea{min-width:280px;min-height:38px;resize:vertical}
  .del{margin-left:auto}
  .add{margin-top:6px}
  .cat{font-size:11px;color:var(--mag);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
  #pv{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){#pv{grid-template-columns:1fr}}
  #pv_top{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;align-items:start}
  @media(max-width:760px){#pv_top{grid-template-columns:1fr}}
  .pvcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .stat{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid var(--line)}
  .stat b{font-family:var(--mono)}
  .big{font-size:30px;font-family:var(--mono);font-weight:600}
  .rev{color:var(--dim);font-size:12px}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
  .bar > div{height:100%}
  .shop{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
  .buy{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);
    border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:pointer;font-size:12px}
  .buy:hover{border-color:var(--accent)}
  .buy.no{opacity:.45;cursor:not-allowed}
  .angle{flex:1;min-width:120px;font-size:12px;padding:9px;text-align:left}
  #toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:7px;z-index:40;max-width:300px}
  .toast{background:var(--panel2);border:1px solid var(--accent2);border-left:4px solid var(--accent2);
    border-radius:7px;padding:9px 11px;font-size:12px;line-height:1.4}
  .toast.bad{border-color:var(--bad);border-left-color:var(--bad)}
  .toast.good{border-color:var(--accent);border-left-color:var(--accent)}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50}
  .mbox{background:var(--panel);border:1px solid var(--accent2);border-radius:11px;padding:20px;max-width:380px;width:90%}
  .mbox h3{margin:0 0 8px;color:var(--accent2);font-size:15px}
  .mbox p{font-size:13px;color:var(--txt);line-height:1.5;margin:0 0 16px}
  textarea.json{width:100%;min-height:320px;font-family:var(--mono);font-size:12px;white-space:pre}
  small.k{font-family:var(--mono);color:var(--dim)}
  @keyframes popup{0%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-44px)}}
  @keyframes flashpulse{0%{box-shadow:0 0 0 0 rgba(212,83,126,0)}45%{box-shadow:0 0 34px 7px rgba(212,83,126,.85)}100%{box-shadow:0 0 0 0 rgba(212,83,126,0)}}
  .flash{animation:flashpulse .55s ease-out}
  .skinbtn{font-size:12px;padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer}
  .skinbtn.on{border-color:var(--accent);color:var(--accent)}
  .skinbtn.lock{opacity:.45;cursor:not-allowed}
  .apsec{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--panel2)}
  .aphd{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
  .apbadge{font-size:10px;background:var(--bg);border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:2px 8px;font-family:var(--mono)}
  /* ===== PHONE SKIN — only on narrow screens. Desktop keeps the full Studio editor. ===== */
  @media (max-width:760px){
    html,body{overscroll-behavior:none;background:#f4f1e9}
    header,.tabs{display:none!important}
    main{max-width:none;padding:0;margin:0}
    #v_preview .pvskins{display:none!important}
    #v_preview .pvwrap{padding:0!important}
    #v_preview .pvph{width:100%!important;max-width:100%!important;height:100vh!important;height:100dvh!important;border:none!important;box-shadow:none!important;
      /* hoia mäng telefoni status-bari alt väljas — safe-area katab notchi, lisapolster pole vaja
         (vana +44px oli Androidi HTML-vieweri jaoks; veebis/PWA-s raiskas iPhone'il ~60px) */
      padding-top:max(env(safe-area-inset-top,12px),12px);
      padding-bottom:calc(env(safe-area-inset-bottom,0px) + 3px);
      padding-left:max(env(safe-area-inset-left,0px),7px);
      padding-right:max(env(safe-area-inset-right,0px),7px)}
    #v_preview .pv-hero{border-top:3px solid #111}
    #v_preview .pv-thumb{border-bottom:3px solid #111}
    /* toastid ÜLES (mitte nuppude/sheetide peale) ja kitsamad — ei sega mängimist */
    #toasts{bottom:auto;top:calc(env(safe-area-inset-top,12px) + 6px);right:10px;max-width:72%}
  }
  /* täisekraanis pole status-bari — võta 44px reserv maha, mäng saab kogu ekraani */
  html:fullscreen #v_preview .pvph{padding-top:max(env(safe-area-inset-top,0px),8px)!important}
</style>

function showTab(id){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.t===id));

//=================== FIELD BIND ===================
function setPath(obj,path,val){const p=path.split(".");let o=obj;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
function inp(arr,idx,field,val,cls,ph){
  const v=(typeof val==="number")?val:(val||"");
  return `<input class="${cls||''}" data-arr="${arr}" data-idx="${idx}" data-field="${field}" value="${String(v).replace(/"/g,'&quot;')}" placeholder="${ph||''}">`;
}
function txt(arr,idx,field,val){
  return `<textarea data-arr="${arr}" data-idx="${idx}" data-field="${field}">${(val||"").replace(/</g,'&lt;')}</textarea>`;
}
document.addEventListener("input",e=>{
  const t=e.target;if(!t.dataset)return;
  if(t.dataset.flavor!==undefined){if(!S.flavor)S.flavor={};const f=t.dataset.flavor;if(f==="prWin"||f==="prLose")S.flavor[f]=t.value;else S.flavor[f]=t.value.split("\n").map(s=>s.trim()).filter(Boolean);save();return;}
  if(t.dataset.arr===undefined)return;
  const arr=t.dataset.arr,idx=+t.dataset.idx,field=t.dataset.field;
  if(field==="posts"){S.postAngles[idx].posts=t.value.split("\n").map(s=>s.trim()).filter(Boolean);save();return;}
  let val=t.value;if(t.type==="checkbox")val=t.checked;else if(t.classList.contains("num"))val=parseFloat(val)||0;
  if(arr==="balance")setPath(S.balance,field,t.classList.contains("num")?(parseFloat(val)||0):val);
  else setPath(S[arr][idx],field,val);
  save();
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-action]");if(!t)return;
  const a=t.dataset.action,arr=t.dataset.arr,idx=+t.dataset.idx;
  if(a==="del"){S[arr].splice(idx,1);save();renderAll()}
  if(a==="add"){S[arr].push(blank(arr));save();renderAll()}
});
function blank(arr){
  const nid="x"+rng().toString(36).slice(2,6);
  if(arr==="upgrades")return{id:nid,cat:"tooling",name:"New upgrade",flavor:"",baseCost:100,hype:1,burn:1,trust:0};
  if(arr==="buzzwords")return{id:nid,name:"New buzzword",flavor:"",mult:1,band:"plausible"};
  if(arr==="events")return{id:nid,type:"buff",title:"New event",body:""};
  if(arr==="postAngles")return{id:nid,label:"New angle",hype:1,posts:[]};
}

function renderUpgrades(){

    h+=`<div class="cat">${c}</div>`;

  if(P.over&&P.endDismissed){nbtn.className="pv-next";nbtn.textContent="Show results →";} // lõpukaart X-iga suletud — saab tagasi
  else if(P.over){nbtn.className="pv-next disabled";nbtn.textContent="Run over";}
  else if(P.ap>0){nbtn.className="pv-next disabled";nbtn.textContent="Next month →";} // lukus kuni AP kulutatud (Siim 11.06)
  else {nbtn.className="pv-next";nbtn.textContent="Next month →";}
  if(pvSheet&&pvSheet!=="boss"&&pvSheet!=="offer"&&!P.over)renderSheetBody(); else if(P.over)closeSheet(); // boss/offer sheets render themselves — don't let pvRender wipe them
  const end=g("pv_end");
  if(P.over&&P.endDismissed){end.className="";end.innerHTML="";} // X-iga suletud: feed jääb sirvitavaks (Siim 12.06)
  else if(P.over){
    const win=P.over==="win";
    const acq=P.over==="acquihire";
    const bought=win&&P.exitType==="buyout";
    const ttl=acq?'🤝 ACQUIHIRED':(bought?'🤝 ACQUIRED':(win?'🦄 UNICORN!':'⏳ YEAR OVER'));
    const accent=win?'var(--grn)':(acq?'var(--gld)':'var(--rd)');
    const sub=acq?('Sold for $'+fmt(valuation())+' in month '+P.month+'. A unicorn this was not.'):(bought?('Acquired for $'+fmt(valuation())+' in month '+P.month+'.'):(win?('Hit $1B in '+P.month+' months.'):('Peaked at $'+fmt(P.peakVal||valuation())+(P.peakMonth?' in month '+P.peakMonth:'')+'. Still a '+stageName()+', not a unicorn.')));
    // ÜKS lõpukaart (Siim 11.06): jagamiskaardi "kollane" stiil, pressiteade eemaldatud.
    const recap=[];
    recap.push(['Best post', P.bestPost?('“'+P.bestPost.slice(0,60)+(P.bestPost.length>60?'…':'')+'”'):'—']);
    if((P.usedShips||[]).length)recap.push(['Dumbest thing you shipped', (pick(P.usedShips)||'').replace(/[.\s]+$/,'')]);
    recap.push(['Total raised', '$'+fmt(P.totalRaised||0)]);
    recap.push(['Real sales', (P.sales||0)+'  ·  revenue $'+(P.sales?fmt(P.sales*47):'0')]);
    if(P.nemesis)recap.push(['Your rival', P.nemesis.name+(P.nemesis.won?' — hit $1B first 🙃':' — $'+fmt(P.nemesis.val))]);
    recap.push(['Paper trail', ptGrade()]);
    const credLine=(P.lastCred>0)?('+'+P.lastCred+' Founder Cred → total '+(META.founderCred||0)):(win?'':'No Founder Cred this time — peak under $10M.');
    const pkt=pocketMoney(),paper=paperStake(),showPaper=pkt<paper*0.99;
    const bandBg=win?'var(--grn)':(acq?'var(--gld)':'var(--rd)');
    end.className="pv-end";
    end.innerHTML=`<div style="width:100%;max-width:340px;border:3px solid var(--bk);background:#fff;box-shadow:6px 6px 0 var(--bk);max-height:96%;overflow-y:auto">
      <div style="position:relative;background:${bandBg};color:#fff;text-align:center;font-size:23px;font-weight:800;text-transform:uppercase;padding:11px 44px;border-bottom:3px solid var(--bk)">${ttl}<button id="pv_endx" style="position:absolute;right:7px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:2px solid var(--bk);background:#fff;color:#111;font-weight:800;font-size:15px;line-height:1;cursor:pointer">✕</button></div>
      <div style="padding:10px 14px 0;text-align:center">
        <div style="font-size:17px;font-weight:800;color:#111">${(P.name||"").replace(/</g,'&lt;')}</div>
        <div style="font-size:10.5px;font-style:italic;color:var(--mut);margin-top:1px">${((P.tagline||"").replace(/\{buzz\}/g,curBuzz().name)).replace(/</g,'&lt;')}</div>
        <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-top:5px;color:#111">Founder: ${(P.archName||"The Dropout").replace(/</g,'&lt;')}</div>
        <div style="font-size:9.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-top:8px">Peak valuation</div>
        <div style="font-family:var(--mono);font-weight:800;font-size:38px;line-height:1;letter-spacing:-1px;color:#111">$${fmt(P.peakVal||valuation())}</div>
        <div style="display:inline-block;background:var(--rd);color:#fff;border:2px solid var(--bk);font-family:var(--mono);font-weight:700;font-size:11px;padding:2px 8px;margin-top:6px">REVENUE: $0</div>
      </div>
      <div style="display:flex;border:2px solid var(--bk);margin:10px 14px 0">${[["BUZZWORD",curBuzz().name],["MONTH",(win?P.month:(B().totalMonths||12))+" / "+(B().totalMonths||12)],["YOU OWN",Math.round(P.ownership||100)+"%"]].map((s,i)=>`<div style="flex:1;padding:5px 3px;text-align:center;${i<2?'border-right:2px solid var(--bk);':''}min-width:0"><div style="font-size:8.5px;font-weight:800;letter-spacing:.4px;color:var(--mut)">${s[0]}</div><div style="font-family:var(--mono);font-weight:700;font-size:11.5px;color:#111;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(s[1]||'').toString().replace(/</g,'&lt;')}</div></div>`).join('')}</div>
      <div style="text-align:center;margin:9px 14px 0;font-size:13px;font-weight:800;color:var(--gld)">In your pocket: $${fmt(pkt)}</div>
      ${showPaper?`<div style="text-align:center;margin:1px 14px 0;font-size:10px;color:var(--mut);font-weight:700">your ${Math.round(P.ownership||100)}% stake ($${fmt(paper)}) is paper${win?' — see you after the lock-up':''}</div>`:''}
      <div style="border:2px solid var(--bk);background:var(--paper);padding:8px 10px;margin:9px 14px 0">${recap.map(r=>`<div style="display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:2px 0"><span style="color:#6b6760;font-weight:700;text-transform:uppercase;font-size:9px;letter-spacing:.4px;flex-shrink:0">${r[0]}</span><span style="color:#111;text-align:right">${(r[1]||'').toString().replace(/</g,'&lt;')}</span></div>`).join('')}</div>
      ${credLine?`<div style="text-align:center;font-size:10.5px;font-weight:700;color:#111;margin:8px 14px 0">${credLine}</div>`:''}
      ${(()=>{const epi=[P.epilogue,ptEpilogue(win)].filter(Boolean).join(" ");return epi?`<div style="border:2px solid var(--bk);background:#fff7da;padding:8px 10px;margin:8px 14px 0;font-size:11px;line-height:1.45;font-style:italic;color:#111">${epi.replace(/</g,'&lt;')}</div>`:'';})()}
      <div style="display:flex;gap:8px;margin:10px 14px 0"><button style="flex:1;border:2px solid var(--bk);background:var(--ylw);color:#111;font-weight:800;text-transform:uppercase;font-size:11px;padding:9px;cursor:pointer" id="pv_share">📸 Save card</button><button style="flex:1;border:2px solid var(--bk);background:var(--bk);color:#fff;font-weight:800;text-transform:uppercase;font-size:11px;padding:9px;cursor:pointer" onclick="newRun(false)">${win?'Go again →':'Try again →'}</button></div>
      <div style="text-align:center;margin:7px 14px 9px"><a href="mailto:siim.mannik@gmail.com?subject=COFOUNDER%20feedback" style="font-size:10px;font-weight:700;color:#6b6760;text-decoration:underline">Found a bug? Have notes? Feedback →</a></div>
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;background:var(--ylw);border-top:3px solid var(--bk);padding:9px"><div style="width:38px;height:38px;border:3px solid var(--bk);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--mono);font-size:15px;color:#111;flex-shrink:0">$0</div><div><div style="font-weight:800;font-size:15px;letter-spacing:.5px;color:#111">COFOUNDER</div><div style="font-size:9.5px;font-weight:700;color:#111">Raise billions. Build nothing.</div></div></div>
    </div>`;
    const sh=g("pv_share");if(sh)sh.onclick=()=>shareCard(win,bought,acq);
    const ex=g("pv_endx");if(ex)ex.onclick=()=>{P.endDismissed=true;pvRender();};
  } else {end.className="";end.innerHTML="";}
}
//=================== SHARE CARD (canvas → PNG) ===================
function shareCard(win,bought,acq){
  const W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const paper="#f4f1e9",bk="#111",ylw="#ffd400",rd="#e5342a",grn="#1f9d55",mut="#6b6760";
  x.fillStyle=paper;x.fillRect(0,0,W,H);
  x.strokeStyle=bk;x.lineWidth=14;x.strokeRect(28,28,W-56,H-56);
  const cx=W/2;
  // teksti mähkimise fix (Siim 12.06): mõõdame measureText-iga — kastides kahaneb font, ridadel sõnapiiri-ellips
  const FF=(w,s)=>w+" "+s+"px Helvetica,Arial,sans-serif";
  const fit=(txt,maxW,w,s,min)=>{x.font=FF(w,s);while(x.measureText(txt).width>maxW&&s>min){s--;x.font=FF(w,s);}};
  const ell=(txt,maxW)=>{if(x.measureText(txt).width<=maxW)return txt;let t=txt;while(t.length>2&&x.measureText(t+"…").width>maxW){const t2=t.replace(/\s+\S*$/,"");t=(t2===t||!t2)?t.slice(0,-2):t2;}return t+"…";};
  x.textAlign="center";x.fillStyle=bk;
  x.font="800 34px Helvetica,Arial,sans-serif";x.fillText("COFOUNDER — the real AI-ntrepreneur game",cx,160);
  const ttl=acq?"ACQUIHIRED":(bought?"ACQUIRED":(win?"UNICORN":"YEAR OVER"));
  x.fillStyle=win?grn:(acq?"#b8860b":rd);x.fillRect(90,250,W-180,170);
  x.fillStyle="#fff";x.font="800 96px Helvetica,Arial,sans-serif";x.fillText(ttl,cx,372);
  x.fillStyle=bk;fit((P.name||""),W-220,"800",62,36);x.fillText((P.name||""),cx,560);
  x.fillStyle=mut;x.font="italic 30px Helvetica,Arial,sans-serif";
  const tg=(P.tagline||"").replace(/\{buzz\}/g,curBuzz().name);x.fillText(ell(tg,W-200),cx,618);
  x.fillStyle=bk;x.font="800 26px Helvetica,Arial,sans-serif";x.fillText("FOUNDER: "+(P.archName||"The Dropout").toUpperCase(),cx,672);
  x.fillStyle=mut;x.font="800 30px Helvetica,Arial,sans-serif";x.fillText("PEAK VALUATION",cx,820);
  x.fillStyle=bk;x.font="800 184px Helvetica,Arial,sans-serif";x.fillText("$"+fmt(P.peakVal||valuation()),cx,1010);
  x.fillStyle=rd;x.font="800 48px Helvetica,Arial,sans-serif";x.fillText("REVENUE: $0",cx,1105);
  const stats=[["BUZZWORD",curBuzz().name],["MONTH",(win?P.month:(B().totalMonths||10))+" / "+(B().totalMonths||10)],["YOU OWN",Math.round(P.ownership||100)+"%"]];
  const bw=(W-180)/3;x.lineWidth=6;
  stats.forEach((s,i)=>{const bx=90+i*bw;x.strokeStyle=bk;x.strokeRect(bx,1210,bw,210);
    x.fillStyle=mut;x.font="800 24px Helvetica,Arial,sans-serif";x.fillText(s[0],bx+bw/2,1285);
    const vs=(s[1]||"").toString();x.fillStyle=bk;fit(vs,bw-26,"800",46,22);x.fillText(vs,bx+bw/2,1360);});
  x.fillStyle="#b8860b";x.font="800 38px Helvetica,Arial,sans-serif";
  x.fillText("In the founder's pocket: $"+fmt(pocketMoney()),cx,1530);
  if((P.usedShips||[]).length){x.fillStyle=mut;x.font="italic 28px Helvetica,Arial,sans-serif";
    const ds="Last shipped: "+(pick(P.usedShips)||"").replace(/[.\s]+$/,"");x.fillText(ell(ds,W-180),cx,1600);}
  const extra=(P.nemesis&&P.nemesis.won)?("RIVAL "+(P.nemesis.name||"").toUpperCase()+" GOT THERE FIRST"):(((P.paperTrail||0)>=2)?("PAPER TRAIL: "+ptGrade().toUpperCase()):"");
  if(extra){x.fillStyle=bk;x.font="800 28px Helvetica,Arial,sans-serif";x.fillText(ell(extra,W-180),cx,1670);}
  x.fillStyle=ylw;x.fillRect(90,1730,W-180,150);
  // bränd-plokk: äpi-ikoon ($0 ruut) + mängu nimi + slogan (Siim 11.06 — jagataval kaardil peab nimi peal olema)
  const tName="COFOUNDER",tSlog="Raise billions. Build nothing.";
  x.font="800 50px Helvetica,Arial,sans-serif";const wName=x.measureText(tName).width;
  x.font="800 32px Helvetica,Arial,sans-serif";const wSlog=x.measureText(tSlog).width;
  const ic=108,gap=26,gw=ic+gap+Math.max(wName,wSlog),gx=cx-gw/2,gy=1730+(150-ic)/2;
  x.strokeStyle=bk;x.lineWidth=8;x.strokeRect(gx+4,gy+4,ic-8,ic-8);
  x.fillStyle=bk;x.textAlign="center";x.font="800 54px Helvetica,Arial,sans-serif";x.fillText("$0",gx+ic/2,gy+ic/2+19);
  x.textAlign="left";
  x.font="800 50px Helvetica,Arial,sans-serif";x.fillText(tName,gx+ic+gap,gy+46);
  x.font="800 32px Helvetica,Arial,sans-serif";x.fillText(tSlog,gx+ic+gap,gy+94);
  x.textAlign="center";
  // download
  try{const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download=(P.name||"cofounder").replace(/[^a-z0-9]+/gi,"_")+"_card.png";a.click();
    toast("good","Card saved","Share your $0-revenue empire.");}catch(e){toast("bad","Could not save","Try a screenshot instead.");}
}

//=================== HELPERS ===================
function fmt(n){if(n===Infinity)return"∞";if(n<1000)return (n<10&&n%1!==0)?n.toFixed(1):Math.round(n).toString();
  const u=["","K","M","B","T","Qa","Qi"];let i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return n.toFixed(2).replace(/\.?0+$/,"")+u[i]}
function toast(cls,t,b){const tt=document.getElementById("toasts");while(tt.children.length>=2)tt.firstChild.remove();const e=document.createElement("div");e.className="toast "+cls;e.innerHTML=`<b>${t}</b><br>${b}`;tt.appendChild(e);setTimeout(()=>{e.style.opacity=0;e.style.transition=".4s";setTimeout(()=>e.remove(),400)},3500)}
function modal(t,b,no,yes,onNo,onYes){document.getElementById("mt").textContent=t;document.getElementById("mb").textContent=b;
  document.getElementById("mno").textContent=no;document.getElementById("myes").textContent=yes;
  const m=document.getElementById("modal");m.style.display="flex";
  document.getElementById("mno").onclick=()=>{m.style.display="none";onNo&&onNo()};
  document.getElementById("myes").onclick=()=>{m.style.display="none";onYes&&onYes()};
}

//=================== TOOLBAR ===================
document.getElementById("exp").onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="content.json";a.click();
};
document.getElementById("imp").onclick=()=>{
  const i=document.createElement("input");i.type="file";i.accept=".json";
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);if(!S.flavor)S.flavor=clone(SEED.flavor);save();renderAll();showTab("upgrades");toast("good","Imported","content.json loaded.")}catch(err){toast("bad","Error","Invalid JSON.")}};r.readAsText(f)};
  i.click();
};
document.getElementById("reseed").onclick=()=>{if(confirm("Replace all content with the seed. Sure?")){S=clone(SEED);P=null;save();renderAll();showTab("upgrades")}};

//=================== JSON VIEW ===================
document.getElementById("v_json").innerHTML=`<p class="hint">Raw content.json. Edit directly and Apply. This is the file the game engine reads.</p><textarea class="json" id="jsonarea"></textarea><div style="margin-top:8px"><button class="pri" id="applyjson">Apply changes</button></div>`;
document.getElementById("applyjson").onclick=()=>{try{S=JSON.parse(document.getElementById("jsonarea").value);if(!S.flavor)S.flavor=clone(SEED.flavor);save();renderAll();toast("good","Applied","")}catch(e){toast("bad","Error","Invalid JSON.")}};

renderAll();

if(!wantStudio){

  showTab("preview");
}else{
  showTab(window.matchMedia("(max-width:760px)").matches ? "preview" : "upgrades");
}
